name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  docs-check:
    name: Validate repository basics
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          test -f README.md
          test -f CONTRIBUTING.md
          test -f SECURITY.md
          test -d docs

  future-build-placeholder:
    name: Application build placeholder
    runs-on: ubuntu-latest
    steps:
      - name: Explain pending stack initialization
        run: echo "Tauri application build will be enabled after frontend initialization."
