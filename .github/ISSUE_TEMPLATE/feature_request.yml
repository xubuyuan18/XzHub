name: 功能建议
description: 提议新的使用场景或能力
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景
      description: 你遇到了什么实际问题？请先描述问题，不要只描述功能名称。
      placeholder: 当我需要……时，目前必须……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 你希望 XzHub 如何解决这个问题？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你目前如何解决，或者还考虑过哪些实现？

  - type: dropdown
    id: area
    attributes:
      label: 功能区域
      options:
        - 托盘与窗口
        - 服务卡片与界面
        - HTTP 或 JSON Provider
        - VPS Agent
        - 历史与通知
        - 开发体验与文档
        - 其他
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: 提交确认
      options:
        - label: 我已经搜索过现有 Issue，没有找到相同建议。
          required: true
        - label: 这个建议符合轻量 Windows 状态面板的产品方向。
          required: true
