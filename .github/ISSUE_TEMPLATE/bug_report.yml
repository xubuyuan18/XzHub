name: Bug 报告
description: 报告可以稳定复现的异常行为
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先确认 Issue 中不包含 Token、Cookie、密码、私钥、真实服务器地址或其他敏感信息。

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 实际发生了什么？
      placeholder: 清楚描述异常行为。
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: 你原本期望发生什么？
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 启动 XzHub
        2. 点击……
        3. 配置……
        4. 出现错误
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: XzHub 版本或 Commit
      placeholder: 例如 v0.1.0 或 commit SHA
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows 版本
      placeholder: 例如 Windows 11 24H2
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      description: 请先删除或遮挡敏感数据。
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: 提交确认
      options:
        - label: 我已经搜索过现有 Issue，没有找到相同问题。
          required: true
        - label: 我已经删除或遮挡所有敏感信息。
          required: true
